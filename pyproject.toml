[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hft-research"
version = "0.1.0"
description = "Institutional-style high-frequency statistical arbitrage research engine (Phase 1)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "HFT Research" }]
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
hft-phase1 = "hft_research.pipeline.phase1:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: end-to-end pipeline tests",
    "benchmark: performance benchmarks",
]

[tool.ruff]
line-length = 100
target-version = "py312"
